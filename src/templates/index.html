<!DOCTYPE html>
<html lang="en" class="antialiased text-slate-900 bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUP! Automation Dashboard</title>
    <!-- Tailwind CSS via CDN for rapid development without a build step for this scale -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .toast-enter { opacity: 0; transform: translateY(100%); }
        .toast-enter-active { opacity: 1; transform: translateY(0); transition: all 300ms ease-out; }
        .toast-exit { opacity: 1; transform: translateY(0); }
        .toast-exit-active { opacity: 0; transform: scale(0.9); transition: all 200ms ease-in; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="w-full max-w-md space-y-8 bg-white p-10 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
        <div>
            <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-slate-900 tracking-tight">ZUP! Automator</h2>
            <p class="mt-2 text-center text-sm text-slate-500">Control the automated gameplay sequence</p>
        </div>

        <div class="space-y-6 mt-8">
            <!-- Status Card with Skeleton/Loading state -->
            <div id="statusCard" class="bg-slate-50 rounded-xl p-5 border border-slate-200 transition-all duration-300 relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <span class="text-sm font-medium text-slate-500">System Status</span>
                    
                    <!-- Loading Skeleton -->
                    <div id="statusSkeleton" class="h-6 w-24 bg-slate-200 rounded animate-pulse"></div>
                    
                    <!-- Actual Status (Hidden initially) -->
                    <span id="statusBadge" class="hidden inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800 transition-colors duration-300">
                        <svg id="statusDot" class="-ml-0.5 mr-1.5 h-2 w-2 text-slate-400 transition-colors duration-300" fill="currentColor" viewBox="0 0 8 8">
                            <circle cx="4" cy="4" r="3" />
                        </svg>
                        <span id="statusText">Unknown</span>
                    </span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button id="btnStart" onclick="startAutomation()" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-brand-500 group-hover:text-brand-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    Start Automation
                </button>

                <button id="btnStop" onclick="stopAutomation()" class="group relative w-full flex justify-center py-3 px-4 border border-slate-300 text-sm font-semibold rounded-xl text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-all duration-200 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-slate-400 group-hover:text-slate-500 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    Stop Sequence
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // DOM Elements
        const statusSkeleton = document.getElementById('statusSkeleton');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusCard = document.getElementById('statusCard');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        // Elegant Toast System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-200';
            const icon = type === 'success' 
                ? `<svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`
                : `<svg class="w-5 h-5 text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`;

            toast.className = `flex items-center p-4 border rounded-xl shadow-lg transition-all transform toast-enter ${bgClass}`;
            toast.innerHTML = `<div class="flex-shrink-0">${icon}</div><div class="ml-3 text-sm font-medium">${message}</div>`;
            
            container.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }

        // Update UI based on status
        function updateUI(isRunning) {
            // Hide skeleton, show actual badge
            statusSkeleton.classList.add('hidden');
            statusBadge.classList.remove('hidden');

            if (isRunning) {
                statusBadge.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 transition-colors duration-300';
                statusDot.className = '-ml-0.5 mr-2 h-2 w-2 text-emerald-500 animate-pulse';
                statusText.textContent = 'Running';
                statusCard.classList.add('border-emerald-200', 'bg-emerald-50/50');
                
                btnStart.disabled = true;
                btnStop.disabled = false;
            } else {
                statusBadge.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-800 transition-colors duration-300';
                statusDot.className = '-ml-0.5 mr-2 h-2 w-2 text-slate-400';
                statusText.textContent = 'Stopped';
                statusCard.classList.remove('border-emerald-200', 'bg-emerald-50/50');

                btnStart.disabled = false;
                btnStop.disabled = true;
            }
        }

        // Fetch Status
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const isRunning = result.data.status === 'running';
                    updateUI(isRunning);
                }
            } catch (error) {
                console.error('Error fetching status:', error);
                statusSkeleton.classList.remove('hidden');
                statusBadge.classList.add('hidden');
            }
        }

        // API Calls
        async function callApi(endpoint, successMessage) {
            try {
                // Optimistic UI update could go here
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    showToast(successMessage, 'success');
                    fetchStatus(); // Refresh actual status
                } else {
                    showToast(data.message || 'An error occurred', 'error');
                }
            } catch (error) {
                showToast('Network error occurred while contacting the server.', 'error');
                fetchStatus();
            }
        }

        function startAutomation() {
            btnStart.disabled = true; // Prevent double clicks
            callApi('/api/start', 'Automation sequence started.');
        }

        function stopAutomation() {
            btnStop.disabled = true;
            callApi('/api/stop', 'Automation sequence stopped.');
        }

        // Initialize polling
        fetchStatus();
        setInterval(fetchStatus, 2000); // Poll every 2 seconds
    </script>
</body>
</html>
